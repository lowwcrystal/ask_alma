[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = backend/tests
filterwarnings =
    ignore::DeprecationWarning:langsmith.*
    ignore::UserWarning:langsmith.*
markers =
    needs_redis: test requires a live Redis connection via REDIS_URL
    needs_redisearch: test requires the RediSearch module on the Redis instance
