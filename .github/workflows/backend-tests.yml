name: backend tests


on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "backend/**"
      - "requirements*.txt"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "requirements*.txt"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-tests:
    name: cache + rag-pipeline tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify Redis + RediSearch
        run: |
          python - <<'PY'
          import redis
          r = redis.Redis(host="localhost", port=6379, socket_connect_timeout=5)
          assert r.ping(), "Redis did not respond to PING"
          modules = r.execute_command("MODULE", "LIST")
          names = set()
          for entry in modules or []:
              if isinstance(entry, (list, tuple)):
                  for item in entry:
                      if isinstance(item, (bytes, bytearray)):
                          names.add(item.decode("utf-8", errors="replace").lower())
                      elif isinstance(item, str):
                          names.add(item.lower())
          assert "search" in names, f"RediSearch module not loaded; got {names!r}"
          print("Redis up and RediSearch loaded")
          PY

      - name: Run failure-mode tests (no network)
        run: pytest backend/tests/test_failure_modes.py -v

      - name: Run correctness tests (requires Redis)
        run: pytest backend/tests/test_cache.py -v

      - name: Run semantic cache tests (requires RediSearch)
        run: pytest backend/tests/test_semantic_cache.py -v

      - name: Run RAG pipeline tests (mocks external I/O)
        run: pytest backend/tests/test_rag_cache.py -v

      - name: Run full suite once more to confirm no ordering flakes
        run: pytest backend/tests -v
